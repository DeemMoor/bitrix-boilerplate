name: CI

# push только для master, иначе PR из веток этого же репо гоняется дважды
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          bash -n scripts/bootstrap
          bash -n scripts/install.sh
          bash -n scripts/init
          bash -n scripts/setup
          bash -n scripts/tests/smoke.sh

      - name: Shellcheck
        run: |
          shellcheck -S warning scripts/bootstrap scripts/install.sh scripts/setup scripts/tests/smoke.sh
          # init старше мастера: держим на уровне error, стиль не чиним задним числом
          shellcheck -S error scripts/init

      - name: Smoke tests
        run: bash scripts/tests/smoke.sh
